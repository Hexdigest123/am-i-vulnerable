[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "am-i-vulnerable"
version = "0.1.0"
description = "Linux-Daemon: prueft neue CVEs aus einem RSS-Feed per Mistral API gegen installierte Pakete, patcht automatisch und alarmiert per E-Mail bei Konflikten"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
am-i-vulnerable = "am_i_vulnerable.cli:main"

[tool.setuptools]
packages = ["am_i_vulnerable"]
