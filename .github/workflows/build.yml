name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege by default; only the release job gets contents: write.
permissions:
  contents: read

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    env:
      # Overrides the Makefile's CFLAGS; hardening flags are appended
      # separately in the Makefile and survive this override.
      CFLAGS: -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build
        run: make

      - name: Test
        run: make check

      - name: Package
        run: make dist

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: am-i-vulnerable-${{ github.sha }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: am-i-vulnerable-${{ github.sha }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
